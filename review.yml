  marketContext: |
    The United Kingdom has the FCA and PRA but no open-insurance obligation; the
    FCA's Open Finance work remains consultation rather than rule. Nothing compels
    a UK insurtech to publish an API. Cytora's closed posture is therefore the
    market-normal outcome, not an outlier — and it is notable precisely because
    Cytora is one of the most genuinely API-centric products in UK commercial
    insurance while publishing none of it.
  conclusion: |
    STUB — identity captured, zero public APIs listed. Cytora runs real APIs behind
    a real gateway with real OAuth 2.0 infrastructure, and documents them properly
    on ReadMe — all of it password-gated to contracted enterprise customers and
    partners. Everything a developer could actually use requires a sales
    conversation via /request-a-demo. apis[] is empty because that is the truth.
