aid: cytora
name: Cytora
review:
  question: Does Cytora expose a public, self-serve developer portal and downloadable
    API specifications for its digital risk processing platform?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  gated: true
  specsHarvested: 0
findings:
  summary: |
    Cytora publishes NO public, self-serve API surface. It is a real API-first
    product company with a real production API — the developer-facing surface is
    simply closed to anyone who is not a provisioned enterprise customer or
    partner.

    Cytora is a London-headquartered insurtech founded in 2012 as a University of
    Cambridge spinout, selling a digital risk processing platform to commercial
    insurers, wholesale brokers, MGAs and reinsurers. Applied Systems announced its
    acquisition of Cytora on 2025-09-09. The product digitises inbound insurance
    submissions (email, PDF, spreadsheet, broker API), maps them onto pre-built
    line-of-business schemas, enriches them from a partner data ecosystem, evaluates
    appetite and priority rules, and routes results downstream.

    Three real technical hosts were confirmed, and all three are closed:

      1. docs.cytora.com — a genuine API reference site hosted on ReadMe
         (CNAME ssl.readmessl.com). Every path returns HTTP 302 to
         /password?redirect=<path>, rendering "Cytora Platform Documentation /
         Password Protected". robots.txt is `User-agent: * / Disallow: /`. Search
         engines have indexed a handful of page titles (Quick start, Adjacent Risk,
         Polaris ProductWriter), but no page body, endpoint, schema or spec is
         retrievable anonymously. This is a login/password wall, NOT a self-serve
         developer portal.
      2. api.cytora.com — resolves via CNAME gateway.cytora-prod.com to
         35.201.81.84 (Google Cloud load balancer). TCP 443 is open, but the TLS
         handshake is reset by peer for anonymous clients, so no HTTP status can be
         obtained. A real production gateway that is not publicly reachable.
      3. auth.cytora.com — an Auth0 EU tenant (CNAME cytora-prod.eu.auth0.com).
         This is the ONLY surface that answers anonymously with real machine-readable
         data: both /.well-known/openid-configuration and
         /.well-known/oauth-authorization-server return HTTP 200 JSON.

    No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, .proto or Postman collection is
    publicly retrievable for Cytora. Zero specs were harvested, so no openapi/
    directory was created. The apis[] array in apis.yml is intentionally EMPTY —
    that is the accurate record, not a gap in the research.

    The GitHub organization github.com/cytora exists (39 public repos, location
    "London, United Kingdom", contact@cytora.com) but contains only legacy
    engineering forks and internal tooling from 2014-2023 (clj-kafka,
    docker-elasticsearch, geospatial-service, nagios-checks). It carries no API
    artifacts and is not a developer surface.

    The public marketing site does describe the API as Cytora's "preferred method"
    of intake — there is a Risk Flow Academy lesson at
    /risk-flow-academy/academy-lessons/api and a blog post titled "Insurers must
    embrace APIs or fall behind" — but both are conceptual education about what an
    API is, containing no endpoint, base URL, version or reference link.
