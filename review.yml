  acordPosture:
    phrase: no ACORD reference found — ships proprietary per-line-of-business schemas
      instead
    searched:
    - ACORD
    - AL3
    - ACORD XML
    - NGDS
    - IVANS
    - Applied Epic
    - Vertafore
    - AMS360
    pagesSearched:
    - https://cytora.com/
    - https://cytora.com/digital-risk-processing
    - https://cytora.com/digital-risk-processing/pre-built-schemas
    - https://cytora.com/digital-risk-processing/data-ecosystem
    - https://cytora.com/digital-risk-processing/pricing-integration
    - https://cytora.com/schemas/property
    - https://cytora.com/schemas/cyber-us
    - https://cytora.com/risk-flow-academy/academy-lessons/api
    - https://cytora.com/about-us
    hits: 0
    detail: |
      Zero occurrences of ACORD, AL3, ACORD XML, NGDS, IVANS, Applied Epic,
      Vertafore or AMS360 across every public Cytora page inspected. Cytora does
      not position itself as ACORD-aligned anywhere in public.

      Instead of ACORD schemas, Cytora publishes its OWN pre-built line-of-business
      schemas as public marketing pages under /schemas/ — commercial-combined,
      construction, cyber-eu, cyber-us, directors-officers, errors-omissions,
      fleet, general-liability, management-liability, professional-liability and
      property. These pages list human-readable field names and descriptions
      (Insured Street Address, Insured City, Insured Zip Code, Statement of Values,
      Loss History) but publish no machine-readable schema file, no JSON Schema and
      no download.

      Context, not posture: Cytora's acquirer Applied Systems is a US agency
      management system vendor (Applied Epic) operating deep in the ACORD/IVANS
      download world, and Duck Creek Technologies appears as a named system-provider
      partner in Cytora's data ecosystem. Neither fact is an ACORD claim BY Cytora,
      and neither was found stated as one.
  insuranceVerbs:
    quote:
      exposed: false
      note: no public quote/rating API; quote digitisation is described as a
        submission-intake use case only
    bind:
      exposed: false
    issue:
      exposed: false
      note: policy digitisation is named as a use case; no public policy issuance API
    fnol:
      exposed: false
      note: FNOL and post-FNOL claim submission intake is a prominently marketed
        capability with out-of-the-box claim schemas, but it is delivered inside the
        platform to contracted customers, not via any public API
    audience: partner-only / enterprise customer — not consumer-facing and not
      openly agent-facing
    summary: Cytora sits UPSTREAM of quote/bind/issue. Its verb is intake and
      digitisation of the submission, then routing into the customer's own
      underwriting, policy admin and claims systems. None of the four canonical
      insurance verbs is exposed on a public API.
