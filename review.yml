    note: |
      Only stock Auth0/OIDC identity scopes are advertised. No product-level or
      resource-level scopes (risk:read, submission:write, claim:create or similar)
      are published anonymously. client_credentials being enabled is consistent with
      machine-to-machine partner integrations being provisioned per customer.
      Registration at /oidc/register is Auth0 dynamic client registration, not a
      developer signup. Client credentials cannot be obtained without a contract.
